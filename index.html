<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Productos</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<h1>Productos</h1>

<div class="bar">
  <input class="search" id="q" type="text" placeholder="Buscar…"/>
  <select id="cat">
    <option value="">Todas las categorías</option>
  </select>
  <button class="primary" onclick="abrirNuevo()">+ Nuevo</button>
</div>

<div id="tbl"></div>

<!-- Modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-titulo">Nuevo producto</h2>
      <button onclick="cerrar()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Nombre *</label>
        <input id="f-nombre" type="text"/>
      </div>
      <div class="row2">
        <div class="field">
          <label>Precio (MXN) *</label>
          <input id="f-precio" type="number" step="0.01" min="0"/>
        </div>
        <div class="field">
          <label>Stock</label>
          <input id="f-stock" type="number" min="0"/>
        </div>
      </div>
      <div class="field">
        <label>Categoría</label>
        <select id="f-cat">
          <option value="">Sin categoría</option>
          <option>Electrónica</option><option>Periféricos</option>
          <option>Audio</option><option>Mobiliario</option>
          <option>Accesorios</option><option>Otro</option>
        </select>
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="f-desc"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button onclick="cerrar()">Cancelar</button>
      <button class="primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const API = '/api/productos';
let lista = [], editId = null;
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(msg, err=false) {
  const d = document.createElement('div');
  d.className = 'toast' + (err?' err':'');
  d.textContent = msg;
  $('toasts').appendChild(d);
  setTimeout(()=>d.remove(), 3000);
}

async function cargar() {
  const q = $('q').value.trim();
  const c = $('cat').value;
  const p = new URLSearchParams();
  if (q) p.set('buscar', q);
  if (c) p.set('categoria', c);
  try {
    const r = await fetch(`${API}?${p}`);
    const j = await r.json();
    lista = j.datos || [];
    render();
    syncCats();
  } catch {
    $('tbl').innerHTML = '<div class="empty">No se pudo conectar al servidor.</div>';
  }
}

function stockStr(s) {
  if (s === 0) return `<span class="stock-out">Sin stock</span>`;
  if (s < 5)   return `<span class="stock-low">${s} uds.</span>`;
  return `<span class="stock-ok">${s} uds.</span>`;
}

function render() {
  if (!lista.length) {
    $('tbl').innerHTML = '<div class="empty">No hay productos.</div>';
    return;
  }
  $('tbl').innerHTML = `
    <table>
      <thead><tr>
        <th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th><th></th>
      </tr></thead>
      <tbody>
        ${lista.map(p=>`
          <tr>
            <td>
              <div style="font-weight:500">${esc(p.nombre)}</div>
              ${p.descripcion?`<div style="color:#999;font-size:12px;margin-top:1px">${esc(p.descripcion)}</div>`:''}
            </td>
            <td>${fmt(p.precio)}</td>
            <td>${stockStr(p.stock)}</td>
            <td style="color:#666">${esc(p.categoria||'—')}</td>
            <td>
              <div class="actions">
                <button onclick="abrirEditar(${p.id})">Editar</button>
                <button class="danger" onclick="eliminar(${p.id},'${esc(p.nombre)}')">Eliminar</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function syncCats() {
  const cats = [...new Set(lista.map(p=>p.categoria).filter(Boolean))].sort();
  const prev = $('cat').value;
  $('cat').innerHTML = '<option value="">Todas las categorías</option>' +
    cats.map(c=>`<option${c===prev?' selected':''}>${esc(c)}</option>`).join('');
}

function abrirNuevo() {
  editId = null;
  $('m-titulo').textContent = 'Nuevo producto';
  ['f-nombre','f-precio','f-stock','f-desc'].forEach(id=>$(id).value='');
  $('f-cat').value='';
  $('modal').classList.add('open');
  $('f-nombre').focus();
}

function abrirEditar(id) {
  const p = lista.find(x=>x.id===id);
  if (!p) return;
  editId = id;
  $('m-titulo').textContent = 'Editar producto';
  $('f-nombre').value = p.nombre;
  $('f-precio').value = p.precio;
  $('f-stock').value  = p.stock;
  $('f-desc').value   = p.descripcion||'';
  $('f-cat').value    = p.categoria||'';
  $('modal').classList.add('open');
  $('f-nombre').focus();
}

function cerrar() { $('modal').classList.remove('open'); }

async function guardar() {
  const nombre = $('f-nombre').value.trim();
  const precio = parseFloat($('f-precio').value);
  if (!nombre || isNaN(precio)) { toast('Nombre y precio son obligatorios.', true); return; }
  const body = {
    nombre, precio,
    descripcion: $('f-desc').value.trim(),
    stock: parseInt($('f-stock').value)||0,
    categoria: $('f-cat').value
  };
  const url = editId ? `${API}/${editId}` : API;
  const r = await fetch(url, {method:editId?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json();
  if (j.ok) { toast(j.mensaje); cerrar(); cargar(); }
  else      { toast(j.mensaje||'Error', true); }
}

async function eliminar(id, nombre) {
  if (!confirm(`¿Eliminar "${nombre}"?`)) return;
  const r = await fetch(`${API}/${id}`, {method:'DELETE'});
  const j = await r.json();
  if (j.ok) { toast(j.mensaje); cargar(); }
  else      { toast(j.mensaje||'Error', true); }
}

let t;
$('q').addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(cargar,280); });
$('cat').addEventListener('change', cargar);
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) cerrar(); });

cargar();
</script>
</body>
</html>
